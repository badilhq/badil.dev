<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // The visitor's stored theme, applied before first paint. Absent or unreadable: the system's.
      try {
        var t = localStorage.getItem('badil-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <title>Not found · badil</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg: #fff; --text: #1c1b19; --muted: #6b6a66; --accent: #c2410c; --dark-bg: #121211; --dark-text: #ecebe8; --dark-muted: #9a9994; --dark-accent: #f58a4b; color-scheme: light; }
      :root[data-theme="dark"] { --bg: var(--dark-bg); --text: var(--dark-text); --muted: var(--dark-muted); --accent: var(--dark-accent); color-scheme: dark; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: var(--dark-bg); --text: var(--dark-text); --muted: var(--dark-muted); --accent: var(--dark-accent); color-scheme: dark; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { padding: 24px; text-align: center; }
      .mark { font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
      p { color: var(--muted); }
      a { color: var(--accent); font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">badil</div>
      <p>This page does not exist.</p>
      <a href="/">Back to the home page</a>
    </main>
  </body>
</html>
