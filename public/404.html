<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // The visitor's stored theme, applied before first paint. Absent or unreadable: the system's.
      try {
        var t = localStorage.getItem('badil-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <title>Not found · badil</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root { --bg: #fafaf7; --text: #111411; --muted: #4b524b; --accent: #0a7a3a; --dark-bg: #0b0d0b; --dark-text: #e4e9e3; --dark-muted: #98a297; --dark-accent: #3ddc84; color-scheme: light; }
      :root[data-theme="dark"] { --bg: var(--dark-bg); --text: var(--dark-text); --muted: var(--dark-muted); --accent: var(--dark-accent); color-scheme: dark; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: var(--dark-bg); --text: var(--dark-text); --muted: var(--dark-muted); --accent: var(--dark-accent); color-scheme: dark; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
      main { padding: 24px; text-align: center; }
      .mark { font-weight: 600; font-size: 20px; letter-spacing: 0; }
      .mark::after { content: ""; display: inline-block; width: 0.6em; height: 1.1em; margin-left: 0.12em; vertical-align: -0.18em; background: var(--accent); }
      p { color: var(--muted); }
      a { color: var(--accent); font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">badil</div>
      <p>This page does not exist.</p>
      <a href="/">Back to the home page</a>
    </main>
  </body>
</html>
