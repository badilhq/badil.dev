<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // The visitor's stored theme, applied before first paint. Absent or unreadable: the system's.
      try {
        var t = localStorage.getItem('badil-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <title>badil: preview environments for every pull request</title>
    <meta name="description" content="Self-hosted preview environments for every pull request, on Kubernetes and Argo CD. Apache-2.0." />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
